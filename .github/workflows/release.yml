name: Release VPN Guardian

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output_name: vpn-guardian-windows-amd64.exe
          - goos: windows
            goarch: '386'
            output_name: vpn-guardian-windows-386.exe
          - goos: windows
            goarch: arm64
            output_name: vpn-guardian-windows-arm64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-H=windowsgui" -o "${{ matrix.output_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Assets & Checksums
        run: |
          mkdir -p dist
          find release-binaries -type f -name "*.exe" -exec cp {} dist/ \;
          cd dist
          sha256sum *.exe > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
