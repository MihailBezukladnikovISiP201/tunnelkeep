PackageIdentifier: MikhailBezukladnikov.VPNGuardian
PackageVersion: 1.0.0
PackageLocale: ru-RU
Publisher: Mikhail Bezukladnikov
PublisherUrl: https://github.com/mbezukladnikov
PublisherSupportUrl: https://github.com/mbezukladnikov/vpn-guardian/issues
PackageName: VPN Guardian
PackageUrl: https://github.com/mbezukladnikov/vpn-guardian
License: MIT
LicenseUrl: https://github.com/mbezukladnikov/vpn-guardian/blob/main/LICENSE
ShortDescription: Легковесный сторожевой сервис (Watchdog) в системном трее Windows для автореконнекта VPN с режимом умной паузы.
Description: |
  VPN Guardian автоматически удерживает стабильное VPN-соединение (Windows RAS SSTP/L2TP, WireGuard, OpenVPN)
  при обрывах сети и провайдера. В отличие от обычных скриптов автореконнекта, приложение поддерживает машину
  состояний с ручной паузой, позволяя штатно отключить VPN без назойливых автоматических повторных подключений.
  Потребляет ~8-12 МБ RAM и 0.0% CPU.
Tags:
  - vpn
  - watchdog
  - reconnect
  - systray
  - wireguard
  - openvpn
  - sstp
Installers:
