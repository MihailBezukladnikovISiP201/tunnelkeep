ShortDescription: Легковесный сторожевой сервис (Watchdog) в трее Windows для автореконнекта VPN туннелей без прав администратора.
Description: |
  TunnelKeep автоматически удерживает стабильное VPN-соединение (Windows RAS SSTP/L2TP, WireGuard, OpenVPN)
  при обрывах сети полностью в пространстве пользователя (без прав локального администратора).
  Предотвращает потерю фокуса и рутинные ручные переподключения. Поддерживает режим умной паузы.
  Потребляет ~8-12 МБ RAM и 0.0% CPU.
